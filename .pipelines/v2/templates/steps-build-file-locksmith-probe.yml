steps:
  - task: NuGetAuthenticate@1
    displayName: Authenticate with the dependencies feed
    inputs:
      azureDevOpsServiceConnection: 'SHINE PowerToys Artifact Feed'
      feedUrl: 'https://pkgs.dev.azure.com/shine-oss/PowerToys/_packaging/PowerToysPublicDependencies/nuget/v3/index.json'

  - template: steps-restore-nuget.yml
  - template: steps-install-terrapin.yml
  - template: steps-install-vcpkg.yml

  - pwsh: |
      $ErrorActionPreference = 'Stop'
      $PSNativeCommandUseErrorActionPreference = $true
      & .\.pipelines\verifyAndSetLatestVCToolsVersion.ps1
      & nuget.exe restore -configFile .pipelines\release-nuget.config -PackagesDirectory . .pipelines\packages.config
      Move-Item -Force 'Microsoft.PowerToys.Telemetry.*\build\include\TraceLoggingDefines.h' 'src\common\Telemetry\TraceLoggingDefines.h'
      & nuget.exe restore 'src\modules\FileLocksmith\FileLocksmithLib\packages.config' -ConfigFile .pipelines\release-nuget.config -PackagesDirectory '$(Build.SourcesDirectory)\packages'
      # SettingsAPI still imports the legacy packages-directory copy despite its PackageReference.
      [xml] $versions = Get-Content -LiteralPath 'Directory.Packages.props' -Raw
      $wil = $versions.SelectSingleNode("//PackageVersion[@Include='Microsoft.Windows.ImplementationLibrary']")
      if (-not $wil.Version) {
        throw 'Missing central version for Windows Implementation Library.'
      }
      & nuget.exe install Microsoft.Windows.ImplementationLibrary -Version $wil.Version -ConfigFile .pipelines\release-nuget.config -OutputDirectory '$(Build.SourcesDirectory)\packages' -NonInteractive
    displayName: Prepare native build dependencies

  - task: VSBuild@1
    displayName: Build FileLocksmithExt and its native project references
    inputs:
      solution: 'src/modules/FileLocksmith/FileLocksmithExt/FileLocksmithExt.vcxproj'
      vsVersion: 18.0
      msbuildArgs: >-
        -restore
        /p:RestorePackagesConfig=true;CIBuild=true;SkipCppCodeAnalysis=1
        /p:RestoreConfigFile="$(Build.SourcesDirectory)\.pipelines\release-nuget.config"
        /p:RestoreRepositoryPath="$(Build.SourcesDirectory)\packages"
      platform: x64
      configuration: Release
      msbuildArchitecture: x64
      maximumCpuCount: true
