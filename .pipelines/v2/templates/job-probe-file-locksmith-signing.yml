parameters:
  - name: signingIdentity
    type: object
  - name: sourceBuildId
    type: string
  - name: unsignedSha256
    type: string

jobs:
  - job: ProbeFileLocksmithSigning
    displayName: Probe File Locksmith x64 signing
    timeoutInMinutes: 45
    pool:
      name: SHINE-INT-L
      demands: ImageOverride -equals SHINE-VS18-Latest
      os: windows
    variables:
      BuildPlatform: x64
    templateContext:
      outputs:
        - output: pipelineArtifact
          artifactName: file-locksmith-unsigned-x64
          targetPath: $(Build.ArtifactStagingDirectory)\file-locksmith-unsigned-x64
          condition: and(succeededOrFailed(), eq(variables['UnsignedProbePayloadStaged'], 'true'))
    steps:
      - checkout: self
        submodules: true
        fetchDepth: 1

      - template: steps-ensure-dotnet-version.yml
        parameters:
          sdk: true
          version: '6.0'
      - template: steps-ensure-dotnet-version.yml

      - ${{ if eq(parameters.sourceBuildId, '0') }}:
        - template: steps-build-file-locksmith-probe.yml

      - ${{ else }}:
        - task: DownloadPipelineArtifact@2
          displayName: Download a captured unsigned DLL from this pipeline
          inputs:
            buildType: specific
            project: $(System.TeamProjectId)
            definition: $(System.DefinitionId)
            buildVersionToDownload: specific
            pipelineId: ${{ parameters.sourceBuildId }}
            allowFailedBuilds: true
            artifactName: file-locksmith-unsigned-x64
            targetPath: $(Agent.TempDirectory)\FileLocksmithSigningInput

      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $path = 'WinUI3Apps\PowerToys.FileLocksmithExt.dll'
          $destination = Join-Path '$(Agent.TempDirectory)' 'FileLocksmithSigningProbe'
          $payload = Join-Path $destination $path
          $sourceDll = if ($env:PROBE_SOURCE_BUILD_ID -eq '0') {
            Join-Path '$(Build.SourcesDirectory)\x64\Release' $path
          } else {
            Join-Path '$(Agent.TempDirectory)\FileLocksmithSigningInput' $path
          }
          $digest = (Get-FileHash -LiteralPath $sourceDll).Hash
          if ($env:PROBE_SOURCE_BUILD_ID -ne '0' -and
              ($env:PROBE_UNSIGNED_SHA256 -notmatch '^[a-fA-F0-9]{64}$' -or $digest -ne $env:PROBE_UNSIGNED_SHA256)) {
            throw 'The downloaded DLL does not match the pinned unsigned SHA-256.'
          }
          if ((Get-AuthenticodeSignature -LiteralPath $sourceDll).Status -ne 'NotSigned') {
            throw 'Expected an unsigned x64 DLL for the signing probe.'
          }
          New-Item -ItemType Directory -Path (Split-Path -Parent $payload) | Out-Null
          Copy-Item -LiteralPath $sourceDll -Destination $payload
          if ($env:PROBE_SOURCE_BUILD_ID -eq '0') {
            $artifact = Join-Path '$(Build.ArtifactStagingDirectory)\file-locksmith-unsigned-x64' $path
            New-Item -ItemType Directory -Path (Split-Path -Parent $artifact) | Out-Null
            Copy-Item -LiteralPath $sourceDll -Destination $artifact
            Write-Host '##vso[task.setvariable variable=UnsignedProbePayloadStaged]true'
          }
          $policy = Get-Content -LiteralPath '.pipelines\ESRPSigning_core.json' -Raw | ConvertFrom-Json
          $batch = @($policy.SignBatches | Where-Object { $_.MatchedPath -contains $path })
          if ($batch.Count -ne 1) {
            throw 'Could not identify the release signing operations for FileLocksmithExt.'
          }
          $batch[0].MatchedPath = @($path)
          $policy.SignBatches = $batch
          $policy | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath (Join-Path $destination 'policy.json') -Encoding utf8NoBOM
          Write-Host "Unsigned SHA256: $digest"
        displayName: Stage exactly one DLL and its release signing policy
        env:
          PROBE_SOURCE_BUILD_ID: ${{ parameters.sourceBuildId }}
          PROBE_UNSIGNED_SHA256: ${{ parameters.unsignedSha256 }}

      - template: steps-esrp-signing.yml
        parameters:
          displayName: Sign only PowerToys.FileLocksmithExt.dll
          signingIdentity: ${{ parameters.signingIdentity }}
          inputs:
            FolderPath: '$(Agent.TempDirectory)\FileLocksmithSigningProbe'
            signType: batchSigning
            batchSignPolicyFile: '$(Agent.TempDirectory)\FileLocksmithSigningProbe\policy.json'
            ciPolicyFile: '$(Build.SourcesDirectory)\.pipelines\CIPolicy.xml'

      - pwsh: |
          $payload = '$(Agent.TempDirectory)\FileLocksmithSigningProbe\WinUI3Apps\PowerToys.FileLocksmithExt.dll'
          $signature = Get-AuthenticodeSignature -LiteralPath $payload
          if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) {
            throw "FileLocksmithExt signature was not valid: $($signature.Status)"
          }
        displayName: Verify the signed DLL
