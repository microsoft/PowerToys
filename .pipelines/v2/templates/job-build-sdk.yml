parameters:
  - name: buildConfigurations
    type: object
    default:
      - Release
  - name: official
    type: boolean
    default: false
  - name: codeSign
    type: boolean
    default: false
  - name: pool
    type: object
    default: []
  - name: signingIdentity
    type: object
    default: {}
  - name: beforeBuildSteps
    type: stepList
    default: []

jobs:
- job: "BuildSDK"
  ${{ if ne(length(parameters.pool), 0) }}:
    pool: ${{ parameters.pool }}
  displayName: Build SDK
  timeoutInMinutes: 240
  cancelTimeoutInMinutes: 1
  templateContext: # Required when this template is hosted in 1ES PT
    outputs:
    - output: pipelineArtifact
      artifactName: SDK
      targetPath: $(Build.ArtifactStagingDirectory)
  steps:
  - checkout: self
    clean: true
    submodules: true
    persistCredentials: True
    fetchTags: false
    fetchDepth: 1

  - template: .\steps-ensure-nuget-version.yml

  - task: NuGetAuthenticate@1

  - ${{ if eq(parameters.official, true) }}:
    - template: .\steps-setup-versioning.yml
      parameters:
        directory: $(build.sourcesdirectory)\src\modules\cmdpal

  - ${{ parameters.beforeBuildSteps }}

  - task: NodeTool@0
    displayName: Use Node.js 22
    inputs:
      versionSpec: '22.x'

  - task: Cache@2
    displayName: Cache CmdPal npm packages
    inputs:
      key: '"cmdpal-npm" | "$(Agent.OS)" | src/modules/cmdpal/ts-sdk/package-lock.json | src/modules/cmdpal/ext/SampleJSExtension/package-lock.json'
      restoreKeys: |
        "cmdpal-npm" | "$(Agent.OS)"
        "cmdpal-npm"
      path: $(Pipeline.Workspace)\.npm

  - pwsh: |-
      npm ci --cache "$(Pipeline.Workspace)\.npm" --prefer-offline &&
      npm run build
    workingDirectory: $(Build.SourcesDirectory)\src\modules\cmdpal\ts-sdk
    displayName: Build CmdPal TypeScript SDK dependency

  - pwsh: |-
      npm ci --cache "$(Pipeline.Workspace)\.npm" --prefer-offline &&
      npm run typecheck &&
      npm run build &&
      npm test
    workingDirectory: $(Build.SourcesDirectory)\src\modules\cmdpal\ext\SampleJSExtension
    displayName: Validate CmdPal sample JavaScript extension

  - pwsh: |-
      & "$(build.sourcesdirectory)\src\modules\cmdpal\extensionsdk\nuget\BuildSDKHelper.ps1" -Configuration "Release" -BuildStep "build" -IsAzurePipelineBuild
    displayName: Build SDK

  - ${{ if eq(parameters.codeSign, true) }}:
    - template: steps-esrp-signing.yml
      parameters:
        displayName: Sign SDK
        signingIdentity: ${{ parameters.signingIdentity }}
        inputs:
          FolderPath: 'src/modules'
          signType: batchSigning
          batchSignPolicyFile: '$(build.sourcesdirectory)\.pipelines\ESRPSigning_sdk.json'
          ciPolicyFile: '$(build.sourcesdirectory)\.pipelines\CIPolicy.xml'

  - pwsh: |-
      & "$(build.sourcesdirectory)\src\modules\cmdpal\extensionsdk\nuget\BuildSDKHelper.ps1" -Configuration "Release" -BuildStep "pack" -IsAzurePipelineBuild
    displayName: Pack SDK

  - task: CopyFiles@2
    displayName: Copy Nuget to Artifact Staging
    inputs:
      sourceFolder: "$(build.sourcesdirectory)/src/modules/cmdpal/extensionsdk/_build"
      contents: '*.nupkg'
      targetFolder: '$(Build.ArtifactStagingDirectory)'

  - ${{ if eq(parameters.codeSign, true) }}:
    - template: steps-esrp-signing.yml
      parameters:
        displayName: Sign NuGet packages
        signingIdentity: ${{ parameters.signingIdentity }}
        inputs:
          FolderPath: $(Build.ArtifactStagingDirectory)
          Pattern: '*.nupkg'
          UseMinimatch: true
          signConfigType: inlineSignParams
          inlineOperation: >-
            [
                {
                    "KeyCode": "CP-401405",
                    "OperationCode": "NuGetSign",
                    "Parameters": {},
                    "ToolName": "sign",
                    "ToolVersion": "1.0"
                },
                {
                    "KeyCode": "CP-401405",
                    "OperationCode": "NuGetVerify",
                    "Parameters": {},
                    "ToolName": "sign",
                    "ToolVersion": "1.0"
                }
            ]
