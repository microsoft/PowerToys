# Debug-only pilot. Do not retry the suite or suppress Win11 infrastructure failures.
steps:
  - pwsh: |
      & "$(Build.SourcesDirectory)\.pipelines\mwbSandboxExperiment.ps1" -Mode Prepare `
        -RunId "$(System.JobId)" -ArtifactRoot "$(Pipeline.Workspace)\$(TestArtifactsName)" `
        -Platform "$(TestPlatform)" -SourceRevision "$(Build.SourceVersion)"
    displayName: Prepare asynchronous privileged MWB Sandbox prerequisite
    timeoutInMinutes: 15

  - pwsh: |
      & "$(Build.SourcesDirectory)\.pipelines\mwbSandboxExperiment.ps1" -Mode Run `
        -RunId "$(System.JobId)" -ArtifactRoot "$(Pipeline.Workspace)\$(TestArtifactsName)" `
        -Platform "$(TestPlatform)" -SourceRevision "$(Build.SourceVersion)" `
        -ResultsDirectory "$(Common.TestResultsDirectory)"
    displayName: Run MWB Sandbox MSTest once on the standard-user desktop
    timeoutInMinutes: 48
    env:
      platform: $(TestPlatform)
      WINAPP_CLI_PATH: $(WINAPP_CLI_PATH)

  - pwsh: |
      & "$(Build.SourcesDirectory)\.pipelines\mwbSandboxExperiment.ps1" -Mode Recover `
        -RunId "$(System.JobId)" -ResultsDirectory "$(Common.TestResultsDirectory)"
    displayName: Recover owned MWB desktop resources as the original standard user
    condition: always()
    timeoutInMinutes: 6

  - pwsh: |
      & "$(Build.SourcesDirectory)\.pipelines\mwbSandboxExperiment.ps1" -Mode Cleanup -RunId "$(System.JobId)"
    displayName: Remove owned MWB firewall prerequisite and provisioning task
    condition: always()
    timeoutInMinutes: 5

  - pwsh: |
      # The Prepare step writes this before any prerequisite throw. If Prepare never
      # reached that point (for example, an unrelated elevation failure), still publish an
      # explicit placeholder rather than silently omitting the diagnostic artifact.
      $reportPath = "$(Pipeline.Workspace)\mwb-prerequisite-report.json"
      if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
        [ordered]@{
          GeneratedUtc = [DateTime]::UtcNow.ToString('o')
          Platform = "$(TestPlatform)"
          Overall = 'REPORT_NOT_GENERATED'
          Reason = 'The Prepare step did not reach prerequisite report generation.'
        } | ConvertTo-Json | Set-Content -LiteralPath $reportPath -Encoding utf8
      }
    displayName: Ensure MWB Sandbox prerequisite report exists
    condition: always()
    timeoutInMinutes: 2

  - task: PublishPipelineArtifact@1
    displayName: Publish MWB Sandbox prerequisite report
    condition: always()
    inputs:
      targetPath: '$(Pipeline.Workspace)\mwb-prerequisite-report.json'
      artifactName: mwb-prerequisite-report-$(System.JobId)
