parameters:
  - name: condition
    type: string
    default: succeeded()

steps:
  - pwsh: |
      $cacheArguments = @{}
      $hidCache = "$(Agent.TempDirectory)\pt-umdf-hid\packages"
      if (Test-Path -LiteralPath $hidCache) {
        $cacheArguments.PackageCache = $hidCache
      }
      & "$(Build.SourcesDirectory)\.pipelines\powerdisplay-idd-poc\Build-Poc.ps1" `
        -WorkRoot "$(Agent.TempDirectory)\pt-umdf-display" `
        -OutputRoot "$(JobOutputDirectory)\powerdisplay-idd" `
        -Platform "$(BuildPlatform)" @cacheArguments
    displayName: Build isolated virtual monitor fixture (never included in installers)
    condition: ${{ parameters.condition }}
