parameters:
  - name: buildPlatform
    type: string
    values: [x64, arm64]
  - name: routeUmdfArm64
    type: boolean
    default: false

jobs:
- job: Resolve
  displayName: Resolve affected UI test projects
  condition: eq(variables['Build.Reason'], 'PullRequest')
  pool:
    ${{ if eq(variables['System.CollectionId'], 'cb55739e-4afe-46a3-970f-1b49d8ee7564') }}:
      name: SHINE-INT-L
    ${{ else }}:
      name: SHINE-OSS-L
    demands: ImageOverride -equals SHINE-VS18-Latest
  steps:
    - checkout: self
      clean: true
      submodules: false
      persistCredentials: True
      fetchTags: false
      fetchDepth: 0

    - pwsh: |
        $ErrorActionPreference = 'Stop'
        $targetBranch = '$(System.PullRequest.TargetBranch)'
        if ([string]::IsNullOrWhiteSpace($targetBranch) -or $targetBranch.StartsWith('$(')) {
          throw 'System.PullRequest.TargetBranch is unavailable for this pull request build.'
        }

        $targetRef = $targetBranch -replace '^refs/heads/', 'refs/remotes/origin/'
        & git fetch --no-tags origin "+${targetBranch}:${targetRef}"
        if ($LASTEXITCODE -ne 0) {
          throw "Failed to fetch pull request target branch '$targetBranch'."
        }

        $mergeBase = & git merge-base HEAD $targetRef
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($mergeBase)) {
          throw "Failed to find the merge base between HEAD and '$targetRef'."
        }

        $changedFiles = @(& git diff --name-only --diff-filter=ACDMRTUXB "$mergeBase...HEAD")
        if ($LASTEXITCODE -ne 0) {
          throw 'Failed to enumerate pull request changes.'
        }

        $result = & "$(Build.SourcesDirectory)\.pipelines\resolveUiTestModules.ps1" `
          -RepoRoot "$(Build.SourcesDirectory)" `
          -ChangedFile $changedFiles
        $modules = @($result.UiTestModules)
        $hasUiTests = if ($modules.Count -gt 0) { 'true' } else { 'false' }
        $hasMwbUiTests = if ($modules -contains 'MouseWithoutBorders.UITests') { 'true' } else { 'false' }
        $hasUmdfHidUiTests = if ($modules -contains 'GrabAndMove.UITests') { 'true' } else { 'false' }
        $hasUmdfDisplayUiTests = if ($modules -contains 'PowerDisplay.UITests') { 'true' } else { 'false' }

        Write-Host "Touched modules: $($result.TouchedModules -join ', ')"
        Write-Host "UI test infrastructure changed: $($result.InfrastructureChanged)"
        Write-Host "Selected UI tests: $($modules -join ', ')"
        Write-Host "##vso[task.setvariable variable=hasUiTests;isOutput=true]$hasUiTests"
        Write-Host "##vso[task.setvariable variable=hasMwbUiTests;isOutput=true]$hasMwbUiTests"
        Write-Host "##vso[task.setvariable variable=hasUmdfHidUiTests;isOutput=true]$hasUmdfHidUiTests"
        Write-Host "##vso[task.setvariable variable=hasUmdfDisplayUiTests;isOutput=true]$hasUmdfDisplayUiTests"
        $platforms = if ('${{ parameters.buildPlatform }}' -eq 'x64') { 'x64Win10', 'x64Win11' } else { 'arm64' }
        foreach ($platform in $platforms) {
          $matrix = & "$(Build.SourcesDirectory)\.pipelines\New-PrUiTestMatrix.ps1" `
            -Modules $modules -Platform $platform -RouteUmdfArm64:('${{ parameters.routeUmdfArm64 }}' -eq 'True')
          if ($platform -eq 'arm64') {
            $hasOrdinaryArm64UiTests = ($matrix.Count -gt 0).ToString().ToLowerInvariant()
            Write-Host "##vso[task.setvariable variable=hasOrdinaryArm64UiTests;isOutput=true]$hasOrdinaryArm64UiTests"
          }
          if ($matrix.Count -gt 0) {
            $matrixJson = ConvertTo-Json -InputObject $matrix -Compress -Depth 4
            Write-Host "##vso[task.setvariable variable=uiTestMatrix${platform};isOutput=true]$matrixJson"
          }
        }
      name: resolve
      displayName: Resolve UI tests from pull request changes
