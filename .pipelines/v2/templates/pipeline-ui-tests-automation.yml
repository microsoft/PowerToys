trigger: none

pr: none

variables:
  - name: runCodesignValidationInjectionBG
    value: false
  - name: EnablePipelineCache
    value: true

parameters:
  - name: umdfHidArm64Image
    type: string
    default: SHINE-W11-Preview-Testing-arm64-TestSigning
    values:
      - disabled
      - SHINE-W11-Preview-Testing-arm64-TestSigning
    displayName: "Isolated ARM64 UMDF image (disabled turns off the route)"
  - name: buildPlatforms
    type: object
    default:
      - x64
      - arm64
  - name: enableMsBuildCaching
    type: boolean
    default: false
  - name: useVSPreview
    type: boolean
    default: false
  - name: useLatestWebView2
    type: boolean
    default: false
  - name: buildSource
    type: string
    default: "buildNow"
    displayName: "Build Source (latestMainOfficialBuild and specificBuildId do not support MWB)"
    values:
      - latestMainOfficialBuild
      - buildNow
      - buildNowSlim
      - specificBuildId
  - name: specificBuildId
    type: string
    default: 'xxxx'
    displayName: "Build ID (only used when Build Source = specificBuildId)"
  - name: uiTestModules
    type: object
    default: []
  - name: umdfHidSmokeOnly
    type: boolean
    default: false
    displayName: "Experimental UMDF HID smoke only (no PowerToys build)"
  # Scale UI tests out: number of parallel test agents (shards) per test platform, 1-6.
  # 1 keeps the single job per platform. Suites are balanced via .pipelines\uiTestDurations.json.
  - name: uiTestShardsX64Win10
    type: number
    default: 1
    values: [1, 2, 3, 4, 5, 6]
    displayName: "UI test shards: x64 Win10"
  - name: uiTestShardsX64Win11
    type: number
    default: 1
    values: [1, 2, 3, 4, 5, 6]
    displayName: "UI test shards: x64 Win11"
  - name: uiTestShardsArm64
    type: number
    default: 1
    values: [1, 2, 3, 4, 5, 6]
    displayName: "UI test shards: arm64"
stages:
  - ${{ if eq(parameters.umdfHidSmokeOnly, true) }}:
    - template: pipeline-umdf-hid-smoke.yml
      parameters:
        ${{ if eq(parameters.umdfHidArm64Image, 'disabled') }}:
          umdfHidArm64Image: ''
        ${{ else }}:
          umdfHidArm64Image: ${{ parameters.umdfHidArm64Image }}
        buildPlatforms: ${{ parameters.buildPlatforms }}
        uiTestModules: ${{ parameters.uiTestModules }}
  - ${{ if eq(parameters.umdfHidSmokeOnly, false) }}:
    - ${{ each platform in parameters.buildPlatforms }}:
      # Full build path: buildNow runs the complete artifact in place; buildNowSlim
      # downloads and installs its installer. MWB requires one of these current-source paths.
      - ${{ if or(eq(parameters.buildSource, 'buildNow'), eq(parameters.buildSource, 'buildNowSlim')) }}:
        - template: pipeline-ui-tests-full-build.yml
          parameters:
            ${{ if eq(parameters.umdfHidArm64Image, 'disabled') }}:
              umdfHidArm64Image: ''
            ${{ else }}:
              umdfHidArm64Image: ${{ parameters.umdfHidArm64Image }}
            platform: ${{ platform }}
            buildSource: ${{ parameters.buildSource }}
            enableMsBuildCaching: ${{ parameters.enableMsBuildCaching }}
            useVSPreview: ${{ parameters.useVSPreview }}
            useLatestWebView2: ${{ parameters.useLatestWebView2 }}
            uiTestModules: ${{ parameters.uiTestModules }}
            uiTestShardsX64Win10: ${{ parameters.uiTestShardsX64Win10 }}
            uiTestShardsX64Win11: ${{ parameters.uiTestShardsX64Win11 }}
            uiTestShardsArm64: ${{ parameters.uiTestShardsArm64 }}

      # Official build path: build UI tests only and download the selected official build.
      - ${{ if and(ne(parameters.buildSource, 'buildNow'), ne(parameters.buildSource, 'buildNowSlim')) }}:
        - template: pipeline-ui-tests-official-build.yml
          parameters:
            ${{ if eq(parameters.umdfHidArm64Image, 'disabled') }}:
              umdfHidArm64Image: ''
            ${{ else }}:
              umdfHidArm64Image: ${{ parameters.umdfHidArm64Image }}
            platform: ${{ platform }}
            buildSource: ${{ parameters.buildSource }}
            specificBuildId: ${{ parameters.specificBuildId }}
            useLatestWebView2: ${{ parameters.useLatestWebView2 }}
            uiTestModules: ${{ parameters.uiTestModules }}
            uiTestShardsX64Win10: ${{ parameters.uiTestShardsX64Win10 }}
            uiTestShardsX64Win11: ${{ parameters.uiTestShardsX64Win11 }}
            uiTestShardsArm64: ${{ parameters.uiTestShardsArm64 }}
