steps:
  - pwsh: |
      $ErrorActionPreference = 'Stop'
      Import-Module Pester -RequiredVersion 3.4.0 -ErrorAction Stop
      $testRoot = "$(Build.SourcesDirectory)\.pipelines\tests"
      $tests = @(Get-ChildItem -LiteralPath $testRoot -Filter 'mwb*.Tests.ps1' -File)
      if ($tests.Count -eq 0) { throw 'No MWB infrastructure tests were discovered.' }
      $tests += Get-Item -LiteralPath (Join-Path $testRoot 'winappCliRelease.Tests.ps1')
      $tests += Get-ChildItem -LiteralPath $testRoot -Filter 'umdfHid*.Tests.ps1' -File
      $tests += Get-Item -LiteralPath (Join-Path $testRoot 'runUiTestAsUser.Tests.ps1')
      $tests += Get-Item -LiteralPath (Join-Path $testRoot 'uiTestSigningSelection.Tests.ps1')
      $null = New-Item -ItemType Directory -Path "$(LogOutputDirectory)" -Force
      $result = Invoke-Pester -Script $tests.FullName -ExcludeTag NativeCompiler -PassThru -Quiet `
        -OutputFile "$(LogOutputDirectory)\pipeline-powershell-tests.xml" -OutputFormat NUnitXml
      $result | Select-Object TotalCount, PassedCount, FailedCount, SkippedCount, PendingCount
      if ($result.TotalCount -le 0 -or $result.PassedCount -ne $result.TotalCount) {
        throw 'Every selected MWB/CLI infrastructure test must execute and pass.'
      }
    displayName: Test MWB and shared CLI infrastructure
    timeoutInMinutes: 10

  - task: PublishTestResults@2
    displayName: Publish MWB and shared CLI infrastructure results
    condition: always()
    inputs:
      testResultsFormat: NUnit
      testResultsFiles: '$(LogOutputDirectory)/pipeline-powershell-tests.xml'
      testRunTitle: 'MWB/CLI infrastructure $(BuildPlatform) $(BuildConfiguration)'
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true
