<!doctype html>
<html>
<head>
	<!-- Set charset -->
	<meta charset="utf-8" />
	<!-- Title (normally not displayed)-->
	<title>Registry Preview Editor</title>
	<link rel="stylesheet" href="http://PowerToysLocalMonaco/monaco.css" />
	<style>
		/* Fits content to window size */
		html, body {
			padding: 0;
		}

		#container, .monaco-editor {
			position: fixed;
			height: 100%;
			left: 0;
			top: 0;
			right: 0;
			bottom: 0;
		}

		.overflowingContentWidgets {
			/*Hides alert box */
			display: none !important
		}
	</style>
</head>

<body>
	<!-- Container for the editor -->
	<div id="container"></div>
	<!-- monaco.js is built from the pinned monaco-editor npm package; see src/Monaco/package.json -->
	<script type="module">
		import { monaco } from 'http://PowerToysLocalMonaco/monaco.js';

		const editor = monaco.editor.create(document.getElementById('container'), {
			automaticLayout: true,
			language: 'reg',
			minimap: { enabled: false },
			scrollBeyondLastLine: false,
			scrollbar: {
				horizontal: 'auto',
				vertical: 'auto',
			},
		});

		window.onresize = () => {
			editor.layout();
		};

		editor.focus();

		// MonacoEditorControl waits for editorReady, sets the theme and text through ExecuteScriptAsync
		// (monaco.editor.setTheme, editor.setValue), and then calls startEditorChangeTracking().
		window.editor = editor;
		window.startEditorChangeTracking = () => {
			editor.getModel().onDidChangeContent((event) => {
				window.chrome.webview.postMessage({ 'id': 'contentChanged', 'content': editor.getValue() });
			});
		};
		window.chrome.webview.postMessage({ 'id': 'editorReady' });
	</script>
</body>
</html>
