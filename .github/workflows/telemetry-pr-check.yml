# NOTE: This workflow depends on .github/scripts/telemetry-pr-check.js for telemetry detection and PR comments.
# Keep this workflow and script behavior in sync when making changes.
name: Telemetry PR Check

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request Number to test against"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: telemetry-pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-telemetry-events:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Choose feedback destination
        id: feedback
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          post_comment=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            --jq ".head.repo.full_name == \"$GITHUB_REPOSITORY\" and .base.repo.full_name == \"$GITHUB_REPOSITORY\"")
          echo "post_comment=$post_comment" >> "$GITHUB_OUTPUT"

      - name: Detect telemetry event changes and comment PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POST_COMMENT: ${{ steps.feedback.outputs.post_comment }}
        run: node .github/scripts/telemetry-pr-check.js
