          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/pr-intake.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.79"
          GH_AW_INFO_AWF_VERSION: "v0.27.44"
